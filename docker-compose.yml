services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sightglass
      POSTGRES_PASSWORD: sightglass
      POSTGRES_DB: sightglass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Uncomment to reach the database from the host (e.g. a SQL client)
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: sightglass
      DB_PASSWORD: sightglass
      DB_NAME: sightglass
      COOKIE_SECURE: false
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      target: client
      args:
        NEXT_PUBLIC_API_URL: /api
        SERVER_API_URL: http://server:3001
    restart: unless-stopped
    ports:
      - "3000"
    depends_on:
      - server

volumes:
  postgres-data:
