info:
  name: Steam Query
  type: http
  seq: 3

http:
  method: GET
  url: https://api.steampowered.com/IStoreQueryService/Query/v1/?input_json={{input_json}}
  params:
    - name: input_json
      value: "{{input_json}}"
      type: query
  body:
    type: json
    data: |-
      {
        "key": "7D730989D35708DC0AD3BCCDB01B0724",
        "query": {
          "filters": {
            "released_only": true,
            "type_filters": {
              "include_games": true,
              "include_packages": false,
              "include_bundles": false,
              "include_dlc": false,
              "include_demos": false,
              "include_links": true,
              "include_links": true
            }
          },
          "count": 5,
          "sort": 2,
          "start": 10
        },
        "context": {
          "language": "english",
          "country_code": "US"
        },
        "data_request": {
          "include_basic_info": true,
          "include_reviews": true,
          "include_ratings": true,
          "include_tag_count": true,
          "include_release": true,
          "include_assets": true,
          "include_supported_languages": true,
          "include_platforms": true
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const body = req.getBody();

        if (body && typeof body === "object") {
          bru.setVar("input_json", body);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
