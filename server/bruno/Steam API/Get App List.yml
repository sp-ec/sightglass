info:
  name: Get App List
  type: http
  seq: 1

http:
  method: GET
  url: https://api.steampowered.com/IStoreService/GetAppList/v1?key={{process.env.STEAM_API_KEY}}
  params:
    - name: key
      value: "{{process.env.STEAM_API_KEY}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
